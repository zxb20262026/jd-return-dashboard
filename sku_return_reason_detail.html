    const exs=(r.examples||[]).map(e=>`「${esc(e)}」`).join(' ');
    const sug=SUGGEST[r.name]||'';
    return `<div class="issue ${cls}"><div class="ih"><span>${r.name}</span><span class="cnt">${r.count} 单 · ${r.pct}%</span></div>${exs?`<div class="ex">${exs}</div>`:''}${sug?`<div class="sug">💡 ${esc(sug)}</div>`:''}</div>`;
  }).join('');
  const rateCls=x.rr_order>=15?'#dc2626':(x.rr_order>=8?'#ea580c':'#374151');
  return `<div class="sku-card">
    <div class="sku-head">
      <span class="sku-name">${esc(x.short)}</span>
      <span class="sku-tag">${esc(x.line)}</span>
      <span class="sku-tag">${esc(x.brand)}</span>
      <span class="rate" style="color:${rateCls}">退货率 ${x.rr_order}%</span>
      <span class="sku-meta">退货 ${x.ret_orders} 单 · 反馈 ${x.desc_total} 条</span>
    </div>
    <div class="sku-meta" style="margin-bottom:6px">${esc(x.sku)} · ${esc(x.name)}</div>
    ${fbHtml}
    ${x.sub_total>0?`<div class="sub-line">另有主观退货 ${x.sub_total} 单（${esc(x.sub_names)}），无具体产品反馈</div>`:''}
  </div>`;
}
const DATA_LEVEL={"倍数不足/虚标":"hard","成像不清晰/模糊":"hard","灯/开关/电池":"hard","故障/不能使用":"hard","卡豆/不下豆":"hard","破损/碎":"hard","掉色/质量":"hard","做工/材质差":"mid","外观瑕疵/二手":"mid","尺寸/重量不适":"mid","不好用/工具差":"mid","缺件/少配件":"mid","熨烫问题":"mid","包装/防护":"mid","材质薄/差":"mid","与要求不符":"mid","颜色/色差":"mid","不好用/效果差":"mid","气味/异味":"mid"};
buildFilter();render();
</script>
